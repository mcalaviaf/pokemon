name: MakeCode Arcade Release

on:
  release:
    types: [created]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MakeCode Arcade
    runs-on: ubuntu-latest

    steps:
      # Compilar exactamente el commit asociado al tag de la Release
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # ============================================================
      # BUILD PARA GITHUB PAGES
      # ============================================================

      - name: Install MakeCode CLI
        run: npm install -g makecode

      - name: Build JavaScript for GitHub Pages
        run: |
          makecode --java-script -u

          echo "Generated files:"
          find built -maxdepth 3 -type f -print

          test -f built/binary.js

          cp built/binary.js assets/js/binary.js

          echo "GitHub Pages binary:"
          ls -lh assets/js/binary.js

      # ============================================================
      # BUILD DE UF2 PARA LA RELEASE
      # ============================================================

      - name: Install PXT
        run: |
          npm install -g pxt
          pxt target arcade

      - name: Build standard project
        run: |
          pxt clean
          pxt install
          pxt build --cloud

      - name: Build D51
        run: |
          pxt clean
          pxt install --hw samd51
          pxt build --hw samd51 --cloud
          cp built/binary.uf2 binary-d51.uf2

      - name: Build F4
        run: |
          pxt clean
          pxt install --hw stm32f401
          pxt build --hw stm32f401 --cloud
          cp built/binary.uf2 binary-f4.uf2

      - name: Build P0
        run: |
          pxt clean
          pxt install --hw rpi
          pxt build --hw rpi --cloud
          cp built/binary.uf2 binary-p0.uf2

      - name: Bundle universal UF2
        run: |
          test -f binary-d51.uf2
          test -f binary-f4.uf2
          test -f binary-p0.uf2

          mkdir -p release

          cat \
            binary-d51.uf2 \
            binary-f4.uf2 \
            binary-p0.uf2 \
            > release/arcade.uf2

      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Upload Release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            release/arcade.uf2 \
            binary-d51.uf2 \
            binary-f4.uf2 \
            binary-p0.uf2 \
            --clobber

      # ============================================================
      # GITHUB PAGES
      # ============================================================

      # IMPORTANTE:
      # assets/js/binary.js ya contiene el JS generado arriba.
      # Ahora copiamos el repositorio completo para publicarlo.
      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='built' \
            --exclude='release' \
            --exclude='binary-d51.uf2' \
            --exclude='binary-f4.uf2' \
            --exclude='binary-p0.uf2' \
            ./ _site/

          echo "Pages binary:"
          ls -lh _site/assets/js/binary.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4